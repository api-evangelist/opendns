name: OpenDNS
description: 'OpenDNS is a cloud-delivered recursive DNS and internet security service
  founded in 2005 and acquired by Cisco in 2015, where its enterprise capabilities now
  form the foundation of the Cisco Umbrella platform. OpenDNS continues to offer free
  consumer products - OpenDNS Home and OpenDNS Family Shield - providing recursive DNS
  resolution, phishing and malware blocking, and content filtering with parental controls
  across every device on a home network, all managed through the OpenDNS dashboard.
  Enterprise DNS-layer security, secure web gateway, and the Investigate threat-intelligence
  API have migrated to Cisco Umbrella (umbrella.cisco.com). Added to the API Evangelist
  network as a Greylock portfolio company in the cybersecurity sector.'
